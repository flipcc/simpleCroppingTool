<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Crop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
    text-align: center;
  }

  .subtitle {
    font-size: 0.875rem;
    color: #666;
    margin-bottom: 1.75rem;
    text-align: center;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 24px rgba(0,0,0,0.06);
    padding: 1.5rem;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  #drop-zone {
    border: 2px dashed #d0d0cc;
    border-radius: 12px;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  #drop-zone:hover, #drop-zone.drag-over {
    background: #f9f9f7;
    border-color: #aaa;
  }

  #drop-zone .icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    display: block;
  }

  #drop-zone p { font-size: 0.9rem; color: #555; }
  #drop-zone span { font-size: 0.8rem; color: #999; }

  #editor { display: none; flex-direction: column; gap: 1rem; }

  #canvas-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #e8e8e4;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    aspect-ratio: 1;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }

  #canvas-wrap:active { cursor: grabbing; }

  canvas#preview { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-row label {
    font-size: 0.8rem;
    color: #666;
    white-space: nowrap;
    width: 36px;
  }

  .control-row input[type=range] {
    flex: 1;
    accent-color: #1a1a1a;
  }

  .control-row span {
    font-size: 0.8rem;
    color: #555;
    min-width: 36px;
    text-align: right;
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid #d0d0cc;
    background: #fff;
    color: #1a1a1a;
    transition: background 0.12s;
  }

  button:hover { background: #f5f5f3; }

  #btn-download {
    background: #1a1a1a;
    color: #fff;
    border-color: transparent;
    flex: 1;
    justify-content: center;
  }

  #btn-download:hover { background: #333; }

  .hint {
    font-size: 0.75rem;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Circle Crop</h1>
<p class="subtitle">Crop any photo into a circle</p>

<div class="card">
  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <span class="icon">⬆️</span>
    <p>Click to upload a photo</p>
    <span>or drag and drop</span>
    <input type="file" id="file-input" accept="image/*" style="display:none">
  </div>

  <div id="editor">
    <div id="canvas-wrap">
      <canvas id="preview"></canvas>
      <svg class="overlay" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <mask id="circ-mask">
            <rect width="420" height="420" fill="white"/>
            <circle cx="210" cy="210" r="205" fill="black"/>
          </mask>
        </defs>
        <rect width="420" height="420" fill="rgba(0,0,0,0.45)" mask="url(#circ-mask)"/>
        <circle cx="210" cy="210" r="205" fill="none" stroke="white" stroke-width="2" stroke-dasharray="8 4"/>
      </svg>
    </div>

    <div class="control-row">
      <label>Zoom</label>
      <input type="range" id="zoom" min="0.1" max="5" step="0.01" value="1">
      <span id="zoom-val">1.0×</span>
    </div>

    <p class="hint">Drag to reposition · scroll or pinch to zoom</p>

    <div class="btn-row">
      <button id="btn-download">⬇ Download circle</button>
      <button id="btn-reset">↺ New photo</button>
    </div>
  </div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const editor = document.getElementById('editor');
const previewCanvas = document.getElementById('preview');
const ctx = previewCanvas.getContext('2d');
const zoomSlider = document.getElementById('zoom');
const zoomVal = document.getElementById('zoom-val');
const canvasWrap = document.getElementById('canvas-wrap');

const SIZE = 420;
previewCanvas.width = SIZE;
previewCanvas.height = SIZE;

let img = null, zoom = 1, offsetX = 0, offsetY = 0;
let dragging = false, lastX, lastY;
let pinchDist = null;

function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const image = new Image();
    image.onload = () => {
      img = image;
      zoom = Math.max(SIZE / img.width, SIZE / img.height);
      zoomSlider.min = zoom * 0.5;
      zoomSlider.max = zoom * 10;
      zoomSlider.value = zoom;
      offsetX = (SIZE - img.width * zoom) / 2;
      offsetY = (SIZE - img.height * zoom) / 2;
      draw();
      dropZone.style.display = 'none';
      editor.style.display = 'flex';
    };
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function clampOffset() {
  offsetX = Math.min(0, Math.max(SIZE - img.width * zoom, offsetX));
  offsetY = Math.min(0, Math.max(SIZE - img.height * zoom, offsetY));
}

function draw() {
  if (!img) return;
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.drawImage(img, offsetX, offsetY, img.width * zoom, img.height * zoom);
  const base = Math.max(SIZE / img.width, SIZE / img.height);
  zoomVal.textContent = (zoom / base).toFixed(1) + '×';
}

zoomSlider.addEventListener('input', () => {
  const cx = SIZE / 2, cy = SIZE / 2;
  const imgCX = (cx - offsetX) / zoom;
  const imgCY = (cy - offsetY) / zoom;
  zoom = parseFloat(zoomSlider.value);
  offsetX = cx - imgCX * zoom;
  offsetY = cy - imgCY * zoom;
  clampOffset(); draw();
});

// Mouse drag
canvasWrap.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  offsetX += e.clientX - lastX; offsetY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  clampOffset(); draw();
});
window.addEventListener('mouseup', () => { dragging = false; });

// Scroll zoom
canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const scale = SIZE / rect.width;
  const mx = (e.clientX - rect.left) * scale;
  const my = (e.clientY - rect.top) * scale;
  const imgCX = (mx - offsetX) / zoom, imgCY = (my - offsetY) / zoom;
  zoom = Math.max(parseFloat(zoomSlider.min), Math.min(parseFloat(zoomSlider.max), zoom * (e.deltaY < 0 ? 1.08 : 0.93)));
  zoomSlider.value = zoom;
  offsetX = mx - imgCX * zoom; offsetY = my - imgCY * zoom;
  clampOffset(); draw();
}, { passive: false });

// Touch drag + pinch
canvasWrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    offsetX += e.touches[0].clientX - lastX; offsetY += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    clampOffset(); draw();
  } else if (e.touches.length === 2 && pinchDist !== null) {
    const newDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const factor = newDist / pinchDist;
    const cx = SIZE / 2, cy = SIZE / 2;
    const imgCX = (cx - offsetX) / zoom, imgCY = (cy - offsetY) / zoom;
    zoom = Math.max(parseFloat(zoomSlider.min), Math.min(parseFloat(zoomSlider.max), zoom * factor));
    zoomSlider.value = zoom;
    offsetX = cx - imgCX * zoom; offsetY = cy - imgCY * zoom;
    pinchDist = newDist;
    clampOffset(); draw();
  }
}, { passive: true });

window.addEventListener('touchend', () => { dragging = false; pinchDist = null; });

document.getElementById('btn-download').addEventListener('click', () => {
  const out = document.createElement('canvas');
  out.width = SIZE; out.height = SIZE;
  const oc = out.getContext('2d');
  oc.beginPath();
  oc.arc(SIZE / 2, SIZE / 2, SIZE / 2, 0, Math.PI * 2);
  oc.clip();
  oc.drawImage(img, offsetX, offsetY, img.width * zoom, img.height * zoom);
  const a = document.createElement('a');
  a.download = 'cropped-circle.png';
  a.href = out.toDataURL('image/png');
  a.click();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  img = null; editor.style.display = 'none'; dropZone.style.display = '';
  fileInput.value = '';
});

fileInput.addEventListener('change', e => loadImage(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadImage(e.dataTransfer.files[0]); });
</script>
</body>
</html>
